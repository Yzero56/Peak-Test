<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}냉장고 지킴이 관리자{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="min-h-screen bg-neutral-100 text-neutral-900">
  {% if not read_only %}
  <header class="border-b border-neutral-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center gap-6 px-5 py-3">
      <a href="/" class="text-[15px] font-bold">냉장고 지킴이 · 관리자</a>
      <nav class="flex gap-4 text-sm text-neutral-600">
        <a href="/fridge" class="hover:text-neutral-900">우리집 냉장고</a>
        <a href="/" class="hover:text-neutral-900">개요</a>
        <a href="/captures" class="hover:text-neutral-900">캡처</a>
        <a href="/devices/new" class="hover:text-neutral-900">기기 등록</a>
      </nav>
    </div>
  </header>
  {% endif %}

  <main class="mx-auto max-w-5xl px-5 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
