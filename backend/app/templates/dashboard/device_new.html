{% extends "base.html" %}
{% block title %}기기 등록 · 냉장고 지킴이 관리자{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-2xl bg-white p-6 shadow-sm">
  <h1 class="text-lg font-bold">기기 등록</h1>
  <p class="mt-1 text-sm text-neutral-500">ESP32 기기 한 대당 하나씩 등록하고, 발급되는 토큰을 기기 펌웨어에 넣어주세요.</p>

  {% if error %}
  <p class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">{{ error }}</p>
  {% endif %}

  <form method="post" action="/devices" class="mt-4 flex flex-col gap-3">
    <div>
      <label class="mb-1 block text-xs text-neutral-500">기기 ID (영문 소문자/숫자/하이픈)</label>
      <input
        name="id"
        placeholder="예: fridge-01"
        pattern="[a-z0-9][a-z0-9-]*"
        required
        class="w-full rounded-lg border border-neutral-200 px-3 py-2.5 text-sm outline-none focus:border-neutral-400" />
    </div>
    <div>
      <label class="mb-1 block text-xs text-neutral-500">기기 이름</label>
      <input
        name="name"
        placeholder="예: 거실 냉장고"
        required
        class="w-full rounded-lg border border-neutral-200 px-3 py-2.5 text-sm outline-none focus:border-neutral-400" />
    </div>
    <button type="submit" class="rounded-lg bg-neutral-900 py-2.5 text-sm font-semibold text-white">등록</button>
  </form>
</div>
{% endblock %}
