{% extends "base.html" %}
{% block title %}로그인 · 냉장고 지킴이 관리자{% endblock %}
{% block content %}
<div class="mx-auto mt-24 w-full max-w-sm rounded-2xl bg-white p-6 shadow-sm">
  <h1 class="text-lg font-bold">관리자 로그인</h1>
  <p class="mt-1 text-sm text-neutral-500">공용 비밀번호를 입력하세요.</p>

  {% if error %}
  <p class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">비밀번호가 올바르지 않아요.</p>
  {% endif %}

  <form method="post" action="/login" class="mt-4 flex flex-col gap-3">
    <input
      type="password"
      name="password"
      placeholder="비밀번호"
      autofocus
      class="rounded-lg border border-neutral-200 px-3 py-2.5 text-sm outline-none focus:border-neutral-400" />
    <button type="submit" class="rounded-lg bg-neutral-900 py-2.5 text-sm font-semibold text-white">
      로그인
    </button>
  </form>
</div>
{% endblock %}
