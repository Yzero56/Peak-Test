<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PEAK Smart Dashboard</title>
  <style>
    /* kang이 docs/presentation.html에 커밋한 팔레트의 light 버전(.slide.light) 그대로 —
       옆에 나란히 뜨는 앱(흰 배경)이랑 톤이 맞도록 dark 대신 이걸 씀. */
    :root {
      --ink: #304254; --paper: #ffffff; --lime: #f7f83e; --muted: #6b7c8c;
      --line: #e4e8ec; --surface: #f6f7f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px, 4vw, 48px); }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    h1 { font-size: clamp(20px, 3vw, 28px); font-weight: 900; margin: 0; color: var(--ink); }
    h1 .brand { background: var(--lime); padding: 0 6px; border-radius: 4px; }
    .muted { color: var(--muted); font-size: 13px; }
    .live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #5c8a1f; }
    .live-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #5c8a1f; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 32px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 6px;
    }
    .card span:first-child { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .number { font-size: 28px; font-weight: 900; color: var(--ink); }
    .card.fresh .number { color: #5c8a1f; }

    h2 { font-size: 13px; font-weight: 700; color: var(--muted);
         text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; }
    .items { display: grid; gap: 8px; }
    .item {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .item strong { font-size: 14.5px; font-weight: 700; color: var(--ink); }
    .item .expiry { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .fresh .badge { background: rgba(92,138,31,.12); color: #5c8a1f; }
    .expiring_soon .badge { background: rgba(201,204,0,.22); color: #7a7c00; }
    .expired .badge { background: rgba(230,70,70,.12); color: #c23c3c; }
    .unknown .badge { background: var(--surface); color: var(--muted); }

    @media (max-width: 640px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .item { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>PEAK <span class="brand">Smart</span></h1>
        <p class="muted">냉장고 재고 · 유통기한 실시간 현황</p>
      </div>
      <span class="live-dot">LIVE</span>
    </header>
    <section class="cards" id="summary" aria-live="polite"></section>
    <h2>냉장고 안 재료</h2>
    <section class="items" id="items"><p class="muted">불러오는 중...</p></section>
  </div>
  <script>
    const CARD_KEYS = [
      ['total_active', '전체', ''],
      ['fresh', '신선', 'fresh'],
      ['expiring_soon', '임박', ''],
      ['expired', '만료', ''],
    ];
    const STATUS_LABEL = { fresh: '신선', expiring_soon: '임박', expired: '만료', unknown: '미확인' };

    const summary = document.querySelector('#summary');
    const items = document.querySelector('#items');

    function render(data) {
      summary.innerHTML = CARD_KEYS.map(([key, label, cls]) =>
        `<div class="card ${cls}"><span>${label}</span><span class="number">${data[key]}</span></div>`
      ).join('');
      if (!data.items.length) {
        items.innerHTML = '<p class="muted">냉장고가 비어있습니다.</p>';
        return;
      }
      items.innerHTML = data.items.map(item => `
        <article class="item ${item.expiry_status}">
          <div>
            <strong>${item.display_name}</strong>
            <div class="expiry">${item.expires_at ? `D${item.days_remaining >= 0 ? '-' + item.days_remaining : '+' + Math.abs(item.days_remaining)}` : '유통기한 미확인'}</div>
          </div>
          <span class="badge">${STATUS_LABEL[item.expiry_status] ?? item.expiry_status}</span>
        </article>
      `).join('');
    }

    async function load() {
      try {
        const response = await fetch('/api/v1/dashboard/summary');
        if (!response.ok) throw new Error('대시보드 API 호출 실패');
        render(await response.json());
      } catch (error) {
        summary.innerHTML = `<p class="muted">${error.message}</p>`;
        items.innerHTML = '';
      }
    }
    load();
    setInterval(load, 4000);
  </script>
</body>
</html>
