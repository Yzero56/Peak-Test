<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>냉장고 모션 감지 — 개발자 모드</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-alt: #f2f4f6;
    --border: #e5e8eb;
    --text: #191f28;
    --text-secondary: #4e5968;
    --text-tertiary: #8b95a1;
    --accent: #3182f6;
    --accent-strong: #1b64da;
    --accent-soft: #eaf2ff;
    --success: #1ec191;
    --success-soft: #e3f9f1;
    --danger: #f04452;
    --danger-soft: #fdeceb;
    --warn: #d97a06;
    --warn-soft: #fdf1de;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --shadow: 0 1px 2px rgba(25,31,40,.04), 0 8px 24px rgba(25,31,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317; --surface: #1c1e22; --surface-alt: #24262b; --border: #2e3136;
      --text: #f2f4f6; --text-secondary: #b0b8c1; --text-tertiary: #7c8591;
      --accent: #5b9bfd; --accent-strong: #86b6ff; --accent-soft: rgba(91,155,253,.16);
      --success: #35d9a8; --success-soft: rgba(53,217,168,.14);
      --danger: #ff6b76; --danger-soft: rgba(255,107,118,.14);
      --warn: #f0a93e; --warn-soft: rgba(240,169,62,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard,
      "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    margin: 0 -16px 20px;
  }
  .topbar h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .topbar .sub { font-size: 11px; color: var(--text-tertiary); font-weight: 600; margin-top: 1px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--success-soft); color: var(--success); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }

  .lan-banner {
    display: none;
    align-items: center; gap: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    border-radius: 14px; padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 13px; font-weight: 600;
  }
  .lan-banner.show { display: flex; }
  .lan-banner .lan-icon { font-size: 18px; flex: none; }
  .lan-banner .lan-text { flex: 1; min-width: 0; }
  .lan-banner .lan-url {
    display: block; font-family: var(--mono);
    font-size: 13.5px; font-weight: 700; color: var(--text);
    margin-top: 2px; word-break: break-all;
  }
  .lan-banner button {
    flex: none; border: none; background: var(--surface); color: var(--accent-strong);
    font-size: 12px; font-weight: 700; padding: 7px 10px; border-radius: 9px;
    cursor: pointer; font-family: inherit;
  }

  .preview-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow);
    padding: 10px; margin-bottom: 12px;
  }
  .preview-frame {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center;
  }
  .preview-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview-frame .placeholder { color: var(--text-tertiary); font-size: 13.5px; text-align: center; padding: 0 24px; }
  .preview-frame .motion-glow {
    position: absolute; inset: 0; border-radius: 14px;
    border: 4px solid var(--accent);
    opacity: 0; transition: opacity .15s ease;
    pointer-events: none;
  }
  .preview-frame .motion-glow.on { opacity: 1; }
  .live-dot {
    position: absolute; top: 10px; left: 10px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.55); color: #fff;
    font-size: 11.5px; font-weight: 700;
    padding: 5px 9px; border-radius: 999px;
  }
  .live-dot .dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4d4f; animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .session-timer {
    position: absolute; top: 10px; right: 10px;
    display: none;
    align-items: center; gap: 6px;
    background: rgba(0,0,0,.55); color: #fff;
    font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    padding: 5px 9px; border-radius: 999px;
    font-family: var(--mono);
  }
  .session-timer.show { display: flex; }
  .session-timer.over { background: rgba(240,68,82,.85); }

  .box {
    position: absolute;
    border-radius: 4px;
    pointer-events: none;
    display: none;
    transition: left .12s linear, top .12s linear, width .12s linear, height .12s linear;
  }
  .box.show { display: block; }
  .track-box { border: 2.5px solid #baff29; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .track-box::before {
    content: "물체"; position: absolute; left: 0; top: -18px;
    background: #baff29; color: #10230a;
    font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 3px;
  }
  .hand-box { border: 2px dashed #ff5a5f; }
  .hand-box::before {
    content: "손"; position: absolute; right: 0; top: -18px;
    background: #ff5a5f; color: #fff;
    font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 3px;
  }

  .rotate-row {
    display: flex; gap: 4px; margin-top: 10px;
    background: var(--surface-alt); border-radius: 12px; padding: 4px;
  }
  .rotate-row button {
    flex: 1; border: none; background: transparent; color: var(--text-secondary);
    font-size: 13px; font-weight: 700; padding: 9px 6px; border-radius: 9px;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: background .15s ease, color .15s ease;
  }
  .rotate-row button.active {
    background: var(--surface); color: var(--accent-strong);
    box-shadow: 0 1px 3px rgba(25,31,40,.12);
  }

  .dev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .dev-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); padding: 14px;
  }
  .dev-card .dev-label {
    font-size: 11px; font-weight: 700; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px;
  }

  .live-crop-frame {
    aspect-ratio: 1; border-radius: 10px; overflow: hidden;
    background: var(--surface-alt); display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .live-crop-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .live-crop-frame .placeholder { font-size: 11px; color: var(--text-tertiary); text-align: center; padding: 0 10px; }
  .crop-meta { font-size: 10.5px; color: var(--text-tertiary); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .diag-rows { display: flex; flex-direction: column; gap: 8px; }
  .diag-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }
  .diag-row .k { color: var(--text-secondary); }
  .diag-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .diag-row .v.ok { color: var(--success); }
  .diag-row .v.wait { color: var(--text-tertiary); }
  .diag-row .v.warn { color: var(--warn); }
  .ratio-track { height: 5px; border-radius: 999px; background: var(--surface-alt); overflow: hidden; margin-top: 2px; }
  .ratio-fill { height: 100%; background: var(--accent); width: 0%; transition: width .15s ease; }

  .state-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 12px; text-align: center;
  }
  .state-label { font-size: 12px; color: var(--text-tertiary); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .state-value { font-size: 22px; font-weight: 800; margin-top: 6px; transition: color .2s ease; }
  .state-value.idle { color: var(--text-secondary); }
  .state-value.motion { color: var(--accent-strong); }
  .meta-row {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 11.5px; color: var(--text-tertiary); font-variant-numeric: tabular-nums;
  }

  .section-label {
    font-size: 12.5px; font-weight: 700; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 20px 0 10px;
  }

  .event-list { display: flex; flex-direction: column; gap: 10px; }
  .event-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow);
    padding: 12px; display: flex; gap: 12px; align-items: center;
  }
  .event-card img {
    width: 56px; height: 56px; border-radius: 10px; object-fit: cover;
    background: var(--surface-alt); flex: none;
  }
  .event-body { flex: 1; min-width: 0; }
  .event-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
  .badge.in { background: var(--success-soft); color: var(--success); }
  .badge.out { background: var(--warn-soft); color: var(--warn); }
  .badge.unknown { background: var(--surface-alt); color: var(--text-tertiary); }
  .event-time { font-size: 12px; color: var(--text-tertiary); }
  .event-sub { margin-top: 4px; font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .empty-note { font-size: 13px; color: var(--text-tertiary); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>냉장고 모션 감지</h1>
        <div class="sub">개발자 모드 — 파이프라인 전 단계 표시</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <a href="/log" style="font-size:13px; font-weight:700; color:var(--accent-strong); text-decoration:none;">로그 →</a>
        <span class="pill bad" id="statusPill">확인 중</span>
      </div>
    </div>

    <div class="lan-banner" id="lanBanner">
      <span class="lan-icon">📱</span>
      <div class="lan-text">
        폰에서 같은 와이파이로 접속
        <span class="lan-url" id="lanUrl"></span>
      </div>
      <button id="lanCopyBtn">복사</button>
    </div>

    <div class="preview-card">
      <div class="preview-frame" id="previewFrame">
        <div class="placeholder" id="previewPlaceholder">카메라 연결을 기다리는 중...</div>
        <img id="previewImg" style="display:none" alt="카메라 실시간 화면" />
        <div class="live-dot"><span class="dot"></span>LIVE</div>
        <div class="session-timer" id="sessionTimer">0.0s</div>
        <div class="motion-glow" id="motionGlow"></div>
        <div class="box track-box" id="trackBox"></div>
        <div id="handBoxes"></div>
      </div>
      <div class="rotate-row" id="rotateRow">
        <button data-deg="0">0°</button>
        <button data-deg="90">90°</button>
        <button data-deg="180">180°</button>
        <button data-deg="270">270°</button>
      </div>
    </div>

    <div class="dev-grid">
      <div class="dev-card">
        <div class="dev-label">지금 이 순간 크롭</div>
        <div class="live-crop-frame">
          <div class="placeholder" id="liveCropPlaceholder">아직 없음</div>
          <img id="liveCropImg" style="display:none" alt="실시간 크롭" />
        </div>
        <div class="crop-meta" id="liveCropMeta">-</div>
      </div>
      <div class="dev-card">
        <div class="dev-label">신호 값</div>
        <div class="diag-rows">
          <div class="diag-row">
            <span class="k">변화 픽셀 비율</span>
            <span class="v" id="diagRatio">0.0%</span>
          </div>
          <div class="ratio-track"><div class="ratio-fill" id="diagRatioFill"></div></div>
          <div class="diag-row">
            <span class="k">손 감지</span>
            <span class="v wait" id="diagHand">-</span>
          </div>
          <div class="diag-row">
            <span class="k">물체 후보</span>
            <span class="v wait" id="diagObj">-</span>
          </div>
          <div class="diag-row">
            <span class="k">폴링</span>
            <span class="v" id="diagPoll">-</span>
          </div>
        </div>
      </div>
    </div>

    <div class="state-card">
      <div class="state-label">현재 상태</div>
      <div class="state-value idle" id="stateValue">대기중</div>
      <div class="meta-row">
        <span id="doorText">리드스위치 없음 — 상시 폴링 중</span>
      </div>
    </div>

    <p class="section-label">최근 이벤트</p>
    <div class="event-list" id="eventList"></div>
    <p class="empty-note" id="emptyNote" style="display:none">아직 감지된 움직임이 없어요</p>
  </div>

<script>
const statusPill = document.getElementById('statusPill');
const stateValue = document.getElementById('stateValue');
const doorText = document.getElementById('doorText');
const eventList = document.getElementById('eventList');
const emptyNote = document.getElementById('emptyNote');
const previewImg = document.getElementById('previewImg');
const previewPlaceholder = document.getElementById('previewPlaceholder');
const motionGlow = document.getElementById('motionGlow');
const trackBox = document.getElementById('trackBox');
const handBoxesEl = document.getElementById('handBoxes');
const sessionTimer = document.getElementById('sessionTimer');
const lanBanner = document.getElementById('lanBanner');
const lanUrl = document.getElementById('lanUrl');
const lanCopyBtn = document.getElementById('lanCopyBtn');
const rotateRow = document.getElementById('rotateRow');
const liveCropImg = document.getElementById('liveCropImg');
const liveCropPlaceholder = document.getElementById('liveCropPlaceholder');
const liveCropMeta = document.getElementById('liveCropMeta');
const diagRatio = document.getElementById('diagRatio');
const diagRatioFill = document.getElementById('diagRatioFill');
const diagHand = document.getElementById('diagHand');
const diagObj = document.getElementById('diagObj');
const diagPoll = document.getElementById('diagPoll');

let lastLiveCropSeq = -1;
const DOOR_BUDGET_S = 5; // 사용자가 말한 "문 여는 시간 5초 이내" 기준선 — 넘으면 타이머가 경고색으로 바뀜

lanCopyBtn.onclick = async () => {
  try {
    await navigator.clipboard.writeText(lanUrl.textContent);
    lanCopyBtn.textContent = '복사됨';
    setTimeout(() => { lanCopyBtn.textContent = '복사'; }, 1500);
  } catch (e) {}
};

function setActiveRotateBtn(deg) {
  rotateRow.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.deg) === deg);
  });
}

rotateRow.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-deg]');
  if (!btn) return;
  const deg = Number(btn.dataset.deg);
  setActiveRotateBtn(deg); // 응답 기다리지 않고 즉시 반영 (체감 지연 없게)
  try {
    await fetch('/api/rotation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ degrees: deg }),
    });
  } catch (e) {}
});

async function tickPreview() {
  try {
    const r = await fetch('/api/frame.jpg?t=' + Date.now());
    if (r.ok) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const old = previewImg.src;
      previewImg.src = url;
      previewImg.style.display = 'block';
      previewPlaceholder.style.display = 'none';
      if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
    }
  } catch (e) {}
  setTimeout(tickPreview, 250);
}
tickPreview();

async function tickLiveCrop(seq) {
  // seq가 바뀔 때만 새로 받아온다 — 세션 없을 땐 계속 503이라 굳이 매번 요청 안 함
  if (seq === lastLiveCropSeq) return;
  lastLiveCropSeq = seq;
  try {
    const r = await fetch('/api/live_crop.jpg?t=' + Date.now());
    if (r.ok) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const old = liveCropImg.src;
      liveCropImg.src = url;
      liveCropImg.style.display = 'block';
      liveCropPlaceholder.style.display = 'none';
      liveCropMeta.textContent = `#${seq}번째 갱신`;
      if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
    }
  } catch (e) {}
}

const BADGE_LABEL = { in: 'IN · 넣음', out: 'OUT · 꺼냄', unknown: '판정 보류' };

function renderHandBoxes(boxes) {
  handBoxesEl.innerHTML = (boxes || []).map(([x0, y0, x1, y1]) => {
    const l = (x0 * 100).toFixed(2), t = (y0 * 100).toFixed(2);
    const w = ((x1 - x0) * 100).toFixed(2), h = ((y1 - y0) * 100).toFixed(2);
    return `<div class="box hand-box show" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%"></div>`;
  }).join('');
}

async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    statusPill.textContent = s.connected ? '연결됨' : '연결 안됨';
    statusPill.className = 'pill ' + (s.connected ? 'ok' : 'bad');

    const open = s.door_open === true;
    const noSwitch = s.door_open === null || s.door_open === undefined;
    stateValue.textContent = noSwitch ? '리드스위치 없음' : (open ? '문 열림' : '문 닫힘');
    stateValue.className = 'state-value ' + (open || noSwitch ? 'motion' : 'idle');
    motionGlow.classList.toggle('on', open);

    if (s.live_bbox) {
      const [x0, y0, x1, y1] = s.live_bbox;
      trackBox.style.left = (x0 * 100) + '%';
      trackBox.style.top = (y0 * 100) + '%';
      trackBox.style.width = ((x1 - x0) * 100) + '%';
      trackBox.style.height = ((y1 - y0) * 100) + '%';
      trackBox.classList.add('show');
    } else {
      trackBox.classList.remove('show');
    }
    renderHandBoxes(s.hand_boxes);

    // 세션 경과 타이머 — "문 여는 시간 5초 이내" 기준 대비 지금 얼마나 걸리고 있는지
    if (open && s.session_start_ts) {
      const elapsed = Date.now() / 1000 - s.session_start_ts;
      sessionTimer.textContent = elapsed.toFixed(1) + 's';
      sessionTimer.classList.add('show');
      sessionTimer.classList.toggle('over', elapsed > DOOR_BUDGET_S);
    } else {
      sessionTimer.classList.remove('show');
    }

    // 신호 값 패널
    const ratioPct = (s.live_ratio || 0) * 100;
    diagRatio.textContent = ratioPct.toFixed(2) + '%';
    diagRatioFill.style.width = Math.min(100, ratioPct * 5) + '%';
    if (!open) {
      diagHand.textContent = '-'; diagHand.className = 'v wait';
      diagObj.textContent = '-'; diagObj.className = 'v wait';
    } else if (s.hand_seen) {
      diagHand.textContent = '감지됨'; diagHand.className = 'v ok';
      diagObj.textContent = s.live_bbox ? '있음' : '없음(빈손)';
      diagObj.className = 'v ' + (s.live_bbox ? 'ok' : 'wait');
    } else {
      diagHand.textContent = '대기 중(문 열리는 중)'; diagHand.className = 'v wait';
      diagObj.textContent = '추적 전'; diagObj.className = 'v wait';
    }
    diagPoll.textContent = `${s.poll_count}장 · ${s.poll_ms}ms`;

    tickLiveCrop(s.live_crop_seq || 0);
    if (!open) {
      liveCropImg.style.display = 'none';
      liveCropPlaceholder.style.display = 'flex';
      liveCropPlaceholder.textContent = '문 닫힘 — 대기';
      lastLiveCropSeq = -1;
    } else if (!s.hand_seen) {
      liveCropImg.style.display = 'none';
      liveCropPlaceholder.style.display = 'flex';
      liveCropPlaceholder.textContent = '손 대기 중...';
    }

    if (noSwitch) {
      doorText.textContent = '리드스위치 없음 — 상시 폴링 중';
    } else {
      doorText.textContent = open ? '🚪 문 열림 — 세션 진행 중' : '🚪 문 닫힘 — 대기 (폴링 안 함)';
    }
    if (typeof s.rotation === 'number') setActiveRotateBtn(s.rotation);

    if (s.lan_url && !s.lan_url.includes(location.hostname)) {
      lanUrl.textContent = s.lan_url;
      lanBanner.classList.add('show');
    } else {
      lanBanner.classList.remove('show');
    }
  } catch (e) {
    statusPill.textContent = '서비스 연결 안됨';
    statusPill.className = 'pill bad';
  }
}

function sourceLabel(src) {
  return { carry: '손-소지물', flow: '플로우', trajectory: '궤적 폴백', state: '문 세션' }[src] || '-';
}

async function refreshEvents() {
  try {
    const r = await fetch('/api/events?limit=30');
    const items = await r.json();
    emptyNote.style.display = items.length ? 'none' : 'block';
    eventList.innerHTML = items.map(ev => {
      const time = new Date(ev.start_ts * 1000).toLocaleTimeString('ko-KR');
      const thumb = ev.has_best_crop ? `/events/${ev.id}/best_crop.jpg` : `/events/${ev.id}/start.jpg`;
      const handInfo = ev.hand_first_ts != null ? `손 첫 감지 ${ev.hand_first_ts}s` : '손 미감지';
      return `<div class="event-card">
        <img src="${thumb}" loading="lazy" />
        <div class="event-body">
          <div class="event-top">
            <span class="badge ${ev.final_classification}">${BADGE_LABEL[ev.final_classification] || ev.final_classification}</span>
            <span class="event-time">${time}</span>
          </div>
          <div class="event-sub">${ev.duration_s}s · 신뢰도 ${(ev.final_confidence * 100).toFixed(0)}% (${sourceLabel(ev.final_source)}) · ${handInfo}</div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {}
}

refreshStatus();
refreshEvents();
setInterval(refreshStatus, 300);
setInterval(refreshEvents, 2000);
</script>
</body>
</html>
